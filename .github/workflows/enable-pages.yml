name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main root
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = { branch: "main", path: "/" };
            const body = { build_type: "legacy", source };
            try {
              const created = await github.request("POST /repos/{owner}/{repo}/pages", {
                owner,
                repo,
                ...body,
              });
              core.info(`created ${created.status} ${created.data.html_url || ""}`);
            } catch (error) {
              const detail = JSON.stringify(error.response?.data || error.message);
              if (error.status !== 409) {
                core.setFailed(`create pages failed: ${error.status} ${detail}`);
                return;
              }
              try {
                const updated = await github.request("PUT /repos/{owner}/{repo}/pages", {
                  owner,
                  repo,
                  ...body,
                });
                core.info(`updated ${updated.status} ${updated.data.html_url || ""}`);
              } catch (updateError) {
                const updateDetail = JSON.stringify(updateError.response?.data || updateError.message);
                core.setFailed(`update pages failed: ${updateError.status} ${updateDetail}`);
                return;
              }
            }
            try {
              const build = await github.request("POST /repos/{owner}/{repo}/pages/builds", {
                owner,
                repo,
              });
              core.info(`build requested ${build.status}`);
            } catch (error) {
              core.warning(`build request failed: ${error.status} ${JSON.stringify(error.response?.data || error.message)}`);
            }
